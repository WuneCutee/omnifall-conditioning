# Val: cùng 4 nguồn train (of-syn + gmdcsa24 + le2i + caucafall) CỘNG OOPS — code gốc chỉ
# chọn checkpoint theo eval_OOPS_fall_f1 khi OOPS có mặt trong val["individual"] (xem
# feature_train_eval.py), nên phải có OOPS ở đây để checkpoint selection đúng ý (chọn theo
# khả năng generalize sang domain thật, không phải val cùng domain train).
name: "feature-dataset-stsyn-val"
feature_datasets:
  - name: "of-syn"
    feature_root: "${oc.env:OMNIFALL_ROOT}/of-syn/features/videomae-kinetics-7d5fps-1f"
    annotations_file: "${oc.env:OMNIFALL_ROOT}/labels/dataset/of-syn.csv"
    feature_fps: 7.5
    frames_per_feature: 16
    feature_stride: 0.133333333
    feature_centered: false
    feature_type: "videomae-kinetics-7d5fps-1f"
    split_root: "${oc.env:OMNIFALL_ROOT}/splits"

  - name: "gmdcsa24"
    feature_root: "${oc.env:OMNIFALL_ROOT}/gmdcsa24/features/videomae-kinetics-7d5fps-1f"
    annotations_file: "${oc.env:OMNIFALL_ROOT}/labels/dataset/GMDCSA24.csv"
    feature_fps: 7.5
    frames_per_feature: 16
    feature_stride: 0.133333333
    feature_centered: false
    feature_type: "videomae-kinetics-7d5fps-1f"
    split_root: "${oc.env:OMNIFALL_ROOT}/splits"

  - name: "le2i"
    feature_root: "${oc.env:OMNIFALL_ROOT}/le2i/features/videomae-kinetics-7d5fps-1f"
    annotations_file: "${oc.env:OMNIFALL_ROOT}/labels/dataset/le2i.csv"
    feature_fps: 7.5
    frames_per_feature: 16
    feature_stride: 0.133333333
    feature_centered: false
    feature_type: "videomae-kinetics-7d5fps-1f"
    split_root: "${oc.env:OMNIFALL_ROOT}/splits"

  - name: "caucafall"
    feature_root: "${oc.env:OMNIFALL_ROOT}/caucafall/features/videomae-kinetics-7d5fps-1f"
    annotations_file: "${oc.env:OMNIFALL_ROOT}/labels/dataset/caucafall.csv"
    feature_fps: 7.5
    frames_per_feature: 16
    feature_stride: 0.133333333
    feature_centered: false
    feature_type: "videomae-kinetics-7d5fps-1f"
    split_root: "${oc.env:OMNIFALL_ROOT}/splits"

  - name: "OOPS"
    feature_root: "${oc.env:OMNIFALL_ROOT}/OOPS/features/videomae-kinetics-7d5fps-1f"
    annotations_file: "${oc.env:OMNIFALL_ROOT}/labels/dataset/OOPS.csv"
    feature_fps: 7.5
    frames_per_feature: 16
    feature_stride: 0.133333333
    feature_centered: false
    feature_type: "videomae-kinetics-7d5fps-1f"
    split_root: "${oc.env:OMNIFALL_ROOT}/splits"

num_features: 18
tokens_per_feature: 1
feature_dim: 768

feature_ext: ".h5"
num_classes: 10
